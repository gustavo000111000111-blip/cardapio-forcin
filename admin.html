<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Forcin Pizzaria</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f4f6f9; color: #333; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; background: #2c3e50; color: #fff; padding: 15px 20px; border-radius: 8px; margin-bottom: 20px; }
        header h1 { font-size: 20px; }
        .btn-sair { background: #e74c3c; color: #fff; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }

        .card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .card h2 { font-size: 18px; margin-bottom: 15px; border-bottom: 2px solid #eee; padding-bottom: 8px; color: #2c3e50; }

        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group.full { grid-column: 1 / -1; }
        label { font-size: 13px; font-weight: bold; margin-bottom: 5px; color: #555; }
        input, select, textarea { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        textarea { resize: vertical; height: 60px; }

        .btn-group { margin-top: 15px; display: flex; gap: 10px; }
        .btn-primary { background: #2980b9; color: #fff; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: bold; }
        .btn-secondary { background: #7f8c8d; color: #fff; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 14px; display: none; }

        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; font-size: 14px; }
        th { background-color: #f8f9fa; color: #666; font-size: 13px; }
        .badge { background: #e8f4fd; color: #2980b9; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Painel Administrativo - Pizzaria</h1>
        <button class="btn-sair" onclick="sairPainel()">Sair</button>
    </header>

    <!-- FORMULÁRIO DE CADASTRO E EDIÇÃO -->
    <div class="card">
        <h2 id="tituloFormulario">Cadastrar Novo Produto</h2>
        <form id="formProduto" onsubmit="salvarProduto(event)">
            <div class="form-grid">
                <div class="form-group">
                    <label>Categoria:</label>
                    <select id="pCategoria">
                        <option value="pizza">Pizza</option>
                        <option value="promocao">Promoção</option>
                        <option value="bebida">Bebida</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Subcategoria:</label>
                    <select id="pSubcategoria">
                        <option value="tradicional">Tradicional</option>
                        <option value="especial">Especial</option>
                        <option value="promocao">Promoção</option>
                    </select>
                </div>
                <div class="form-group full">
                    <label>Nome do Produto:</label>
                    <input type="text" id="pNome" placeholder="Ex: Calabresa Especial" required>
                </div>
                <div class="form-group full">
                    <label>Descrição / Ingredientes:</label>
                    <textarea id="pDescricao" placeholder="Mussarela, calabresa, cebola..."></textarea>
                </div>

                <!-- PREÇOS -->
                <div class="form-group">
                    <label>Preço Broto (R$):</label>
                    <input type="number" step="0.01" id="pBroto" value="0">
                </div>
                <div class="form-group">
                    <label>Preço Média (R$):</label>
                    <input type="number" step="0.01" id="pMedia" value="0">
                </div>
                <div class="form-group">
                    <label>Preço Grande (R$):</label>
                    <input type="number" step="0.01" id="pGrande" value="0">
                </div>
                <div class="form-group">
                    <label>Preço Família (R$):</label>
                    <input type="number" step="0.01" id="pFamilia" value="0">
                </div>
                <div class="form-group">
                    <label>Preço Ituana (R$):</label>
                    <input type="number" step="0.01" id="pItuana" value="0">
                </div>
                <div class="form-group">
                    <label>Preço Único / Bebida (R$):</label>
                    <input type="number" step="0.01" id="pUnico" value="0">
                </div>
            </div>

            <div class="btn-group">
                <button type="submit" id="btnSalvarForm" class="btn-primary">Cadastrar Produto</button>
                <button type="button" id="btnCancelarForm" class="btn-secondary" onclick="cancelarEdicao()">Cancelar Edição</button>
            </div>
        </form>
    </div>

    <!-- LISTA DE PRODUTOS -->
    <div class="card">
        <h2>Itens do Cardápio</h2>
        <input type="text" id="inputBusca" oninput="filtrarProdutos()" placeholder="🔍 Buscar por nome ou categoria..." style="width: 100%; margin-bottom: 15px;">

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Produto</th>
                        <th>Categoria</th>
                        <th>Preço Base</th>
                        <th style="text-align: right;">Ações</th>
                    </tr>
                </thead>
                <tbody id="tabelaProdutos">
                    <tr><td colspan="5" style="text-align:center;">Carregando...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="admin.js"></script>
</body>
</html>

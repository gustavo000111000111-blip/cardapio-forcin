<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja Borboleta</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="logo">
        <img src="img/semfundo.png" alt="Loja Borboleta">
    </div>
    <div class="cart-icon-container">
        <button class="cart-btn" onclick="toggleCart()" aria-label="Ver Sacola">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="9" cy="21" r="1"></circle>
                <circle cx="20" cy="21" r="1"></circle>
                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
            </svg>
            <span class="cart-count" id="cartCount">0</span>
        </button>
    </div>
</header>

    <div class="tabs-container">
        <button class="tab-btn active" onclick="switchTab('roupas', this)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2a3 3 0 0 0-3 3c0 .8.3 1.5.8 2L2 14v2h20v-2L14.2 7c.5-.5.8-1.2.8-2a3 3 0 0 0-3-3z"/>
            </svg>
            Roupas
        </button>
        <button class="tab-btn" onclick="switchTab('acessorios', this)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <path d="M16 10a4 4 0 0 1-8 0"></path>
            </svg>
            Bolsas & Acessórios
        </button>
        <button class="tab-btn" id="tabBebidas" onclick="switchTab('bebidas', this)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
                <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
                <line x1="6" y1="1" x2="6" y2="4"></line>
                <line x1="10" y1="1" x2="10" y2="4"></line>
                <line x1="14" y1="1" x2="14" y2="4"></line>
            </svg>
            Bebidas
        </button>
    </div>

    <main>
        <div id="productGrid" class="products-grid">
        </div>
    </main>

    <div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>

    <div class="cart-drawer" id="cartDrawer">
        <div class="cart-header">
            <h3>Sua Sacola</h3>
            <button class="close-cart" onclick="toggleCart()">✕</button>
        </div>
        <div class="cart-items" id="cartItemsContainer">
            <p style="text-align:center; color:#888; margin-top:20px;">Sua sacola está vazia.</p>
        </div>
        <div class="cart-footer">
            <button class="checkout-whatsapp" onclick="checkoutWhatsApp()">Finalizar Compra via WhatsApp</button>
        </div>
    </div>

    <!-- Modal de Produto -->
    <div class="product-modal-overlay" id="productModalOverlay" onclick="closeProductModal()"></div>
    <div class="product-modal" id="productModal">
        <button class="close-modal" onclick="closeProductModal()">✕</button>
        <div class="modal-gallery" id="modalGallery">
            <button class="gallery-arrow prev" onclick="prevImage()">❮</button>
            <img id="modalImg" src="" alt="Produto">
            <button class="gallery-arrow next" onclick="nextImage()">❯</button>
        </div>
        <div class="modal-info">
            <h2 id="modalTitle"></h2>
            <p id="modalPrice" class="modal-price"></p>
            <p id="modalColor" class="modal-color" style="font-size: 14px; color: #666; margin: 4px 0 10px; display: none;"></p>

            <!-- Tamanho -->
            <div id="modalSizesContainer" class="modal-sizes-container" style="display: none;">
                <label class="size-label">Selecione o Tamanho:</label>
                <div id="modalSizes" class="size-options"></div>
            </div>

            <button class="buy-btn-modal" onclick="addModalProductToCart()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <path d="M16 10a4 4 0 0 1-8 0"></path>
                </svg>
                Adicionar à Sacola
            </button>
        </div>
    </div>

    <!-- Modal de Anúncio (Upsell) -->
    <div class="product-modal-overlay" id="upsellModalOverlay" onclick="closeUpsellModal()"></div>
    <div class="product-modal" id="upsellModal" style="text-align: center; padding: 25px; max-width: 400px;">
        <p style="font-size: 18px; font-weight: bold; margin-bottom: 20px;">Leve também refrigerante</p>
        <div style="display: flex; flex-direction: column; gap: 10px;">
            <button class="buy-btn-modal" onclick="goToBebidas()">Ir para a aba Bebidas</button>
            <button class="buy-btn-modal" style="background: #e0e0e0; color: #333;" onclick="closeUpsellModal()">Já adicionei/Não quero</button>
        </div>
    </div>

    <div class="toast" id="toastNotification">Produto adicionado à sacola!</div>

    <footer>
        Desenvolvido por <a href="https://devbleed.vercel.app" target="_blank">DevBleed</a>
    </footer>

    <script src="script.js"></script>
</body>
</html>

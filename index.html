<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio Forcin</title>

    <!-- Previne o erro 404 do favicon.ico -->
    <link rel="shortcut icon" href="#">

    <!-- Importação do ficheiro JavaScript principal -->
    <script src="script.js" defer></script>
</head>
<body>

    <!-- Navegação de Abas -->
    <nav class="abas">
        <button type="button" onclick="trocarAba('pizzas')">Pizzas</button>
        <button type="button" onclick="trocarAba('promocoes')">Promoções</button>
        <button type="button" onclick="trocarAba('bebidas')">Bebidas</button>
    </nav>

    <!-- Conteúdo das Abas -->
    <main>
        <section id="pizzas" class="aba-conteudo">
            <div id="cardapioContainer"></div>
        </section>

        <section id="promocoes" class="aba-conteudo" style="display: none;">
            <div id="promocoesContainer"></div>
        </section>

        <section id="bebidas" class="aba-conteudo" style="display: none;">
            <div id="bebidasContainer"></div>
        </section>
    </main>

</body>
</html>
